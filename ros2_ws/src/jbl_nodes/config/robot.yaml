# Parameters for robot_record.launch.py and robot_policy.launch.py on autoJetsonBot.
# Only values that are specific to the robot or must agree between nodes are listed; everything
# else is each node's default (docs/INTERFACES.md). The safety gate reads jbl_safety's own
# config/safety_gate.yaml first, then this file.
# Doubles are written with a decimal point: Humble and newer reject 10 for a double parameter.

# Calibrate both on your robot (docs/PROTOCOL.md sections 4 and 5) and write them here: this
# section reaches every node, so safety_gate, dock_judge and servo_baseline cannot disagree.
/**:
  ros__parameters:
    forward_angle: 0.0   # /scan angle that points straight ahead (URDF yaw 0; may be pi)
    hfov_rad: 1.0856     # stock Raspberry Pi Camera v2 lens, 62.2 deg; measure it (PROTOCOL section 5)

camera_node:
  ros__parameters:
    source: camera
    # OpenCV device index, path or GStreamer pipeline. The Pi Camera v2 on the Nano's CSI port
    # is read through Argus (/dev/video0 is raw RG10 Bayer, which OpenCV cannot use); that needs
    # the container started with --runtime nvidia -v /tmp/argus_socket:/tmp/argus_socket
    # (docs/PROTOCOL.md section 4). 1640x1232 is the IMX219's full-sensor 4:3 mode: its
    # 1280x720 and 1920x1080 sensor modes are centre crops, with a narrower HFOV and a VFOV too
    # small to see the 10 cm marker when docked. A USB camera: device: "0".
    device: "nvarguscamerasrc sensor-id=0 ! video/x-raw(memory:NVMM),width=1640,height=1232,framerate=30/1 ! nvvidconv ! video/x-raw,width=640,height=480,format=BGRx ! videoconvert ! video/x-raw,format=BGR ! appsink drop=true max-buffers=1"
    width: 640
    height: 480
    fps: 30.0
    compressed_fps: 15.0  # the recorded stream (about 2 GB per hour of bag)
    jpeg_quality: 85
    frame_id: camera_link

dock_judge:
  ros__parameters:
    image_topic: /camera/image_raw/compressed
    auto_end: true

servo_baseline:
  ros__parameters:
    image_topic: /camera/image_raw/compressed

policy_runner:
  ros__parameters:
    image_topic: /camera/image_raw/compressed
    rate_hz: 10.0
    max_image_age: 0.2
