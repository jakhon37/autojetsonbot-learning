# Start poses for the scripted demonstrations in simulation (scripts/sim_e2e.sh), the sim
# counterpart of the 20 teleop training spots of docs/PROTOCOL.md section 6.
#
# fake_robot needs pose ids 0..N-1 in one file, so ids 0-9 repeat the test poses of
# start_poses.yaml unchanged (test_sim_demo_poses.py checks that) and are NOT used for demos;
# the demos start only from the training spots 10-29. Same conventions as start_poses.yaml
# (distance / lateral / heading relative to the box front face).
#
# The spots were drawn at random (numpy seed 20261028) from distance 0.70-1.70 m, |lateral|
# <= 0.55 m, |heading| <= 45 deg, keeping each base_link position at least 0.10 m from every
# test pose and every other spot, with 5 of 20 starting with the marker out of view (found
# within a 90 deg turn). Bearing and view measured in the simulator for the default box.
#
#   id  dist  lateral  heading | world x, y, yaw      | bearing | start view
#   10  0.72  -0.36   +14   |  0.78, -0.36,  +14    |  +14.3  | visible
#   11  0.72  +0.07   -39   |  0.78,  0.07,  -39    |  +38.4  | out of view, ~3 deg left turn
#   12  1.38  +0.14   -29   |  0.12,  0.14,  -29    |  +24.9  | visible
#   13  0.90  +0.07   +28   |  0.60,  0.07,  +28    |  -36.2  | visible
#   14  1.27  -0.21   +16   |  0.23, -0.21,  +16    |   -7.2  | visible
#   15  0.96  +0.42   +23   |  0.54,  0.42,  +23    |  -50.9  | out of view, ~13 deg right turn
#   16  1.09  -0.22    +8   |  0.41, -0.22,   +8    |   +3.7  | visible
#   17  1.01  -0.30   +14   |  0.49, -0.30,  +14    |   +2.8  | visible
#   18  1.13  -0.46   -33   |  0.37, -0.46,  -33    |  +59.2  | out of view, ~21 deg left turn
#   19  1.19  +0.17   +28   |  0.31,  0.17,  +28    |  -39.1  | out of view, ~2 deg right turn
#   20  1.64  +0.26   -36   | -0.14,  0.26,  -36    |  +28.6  | visible
#   21  1.17  +0.50   +36   |  0.33,  0.50,  +36    |  -63.2  | out of view, ~25 deg right turn
#   22  0.79  -0.09    -1   |  0.71, -0.09,   -1    |   +8.6  | visible
#   23  1.12  -0.07    -6   |  0.38, -0.07,   -6    |  +10.5  | visible
#   24  1.48  +0.08    -1   |  0.02,  0.08,   -1    |   -2.2  | visible
#   25  1.69  -0.12   -15   | -0.19, -0.12,  -15    |  +20.2  | visible
#   26  0.88  -0.15   -10   |  0.62, -0.15,  -10    |  +22.1  | visible
#   27  1.57  -0.26   +13   | -0.07, -0.26,  +13    |   -3.8  | visible
#   28  1.44  +0.55   +10   |  0.06,  0.55,  +10    |  -32.9  | visible
#   29  0.76  -0.51   +29   |  0.74, -0.51,  +29    |   +5.5  | visible
