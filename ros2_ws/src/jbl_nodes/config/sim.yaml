# Parameters for sim_dock.launch.py (fake_robot). Only values that are specific to the
# simulation or must agree between nodes are listed; everything else is each node's default.
# Doubles are written with a decimal point: Humble and newer reject 10 for a double parameter.

/**:
  ros__parameters:
    forward_angle: 0.0   # fake_robot's beam at angle 0 points straight ahead
    hfov_rad: 1.396      # what the judge and the servo assume; = fake_robot camera_hfov_rad

fake_robot:
  ros__parameters:
    box_x: 1.5           # front face centre (m) in the 4 x 3 m room
    box_y: 0.0
    box_yaw: 3.14159265  # the face looks along -x
    camera_hfov_rad: 1.396  # the simulated lens (80 deg); the robot's Pi Camera v2 is 1.0856
    camera_fps: 15.0     # the rate camera_node records /camera/image_raw/compressed at
    scan_rate: 10.0      # RPLidar A1
    jpeg_quality: 85
    cmd_timeout: 0.5     # backstop only; the gate already zeroes /cmd_vel after 0.3 s

dock_judge:
  ros__parameters:
    image_topic: /camera/image_raw/compressed
    auto_end: true
    # The controller's request (/cmd_vel_in) counts as still only at |v| <= this (m/s). v2/v3
    # used 0.02, which passed a controller still creeping; set 0.02 to reproduce them.
    request_still_v: 0.005

servo_baseline:
  ros__parameters:
    image_topic: /camera/image_raw/compressed
    # Stopped at range <= 0.27 m (target_range + range_tol), drive again only above 0.27 + this
    # (m), so lidar noise cannot toggle the stop. v2/v3 had no hysteresis (0.0).
    stop_hysteresis: 0.03

policy_runner:
  ros__parameters:
    image_topic: /camera/image_raw/compressed
    rate_hz: 10.0
    max_image_age: 0.2
    # ONNX Runtime intra-op threads (onnxruntime backend). Every run up to v4 (the clean run, v2,
    # v3, v4) ran WITHOUT this line, i.e. with 0 = ONNX Runtime's default: a pool sized from the
    # host's cores (4), workers pinned and spinning, also inside v4's 3-core SIM_CPUSET, which it
    # oversubscribed; v4's inference ran 2-3x slower than v3's (results/sim_eval_v4_cleanstop/
    # exploratory/TIMING.md). 2 gave v3-like latency in that cpuset. Set 0 to reproduce v4.
    intra_op_threads: 2
